<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The reset token is in this page's URL: don't send it to other sites. -->
  <meta name="referrer" content="no-referrer" />
  <title>BugBeat — Reset Password</title>
  <link rel="icon" type="image/png" href="bugbeatLogo.png" />
  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cb-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=7" />
  <link rel="stylesheet" href="auth.css?v=17" />
</head>
<body class="auth-page">

  <div class="auth-visual">
    <canvas id="auth-rain" class="auth-rain-bg" aria-hidden="true"></canvas>
    <img src="bugbeatLogo-bg.png" alt="" class="auth-bg-logo auth-bg-logo--dark" aria-hidden="true" />
    <img src="bugbeatLogo.png" alt="" class="auth-bg-logo auth-bg-logo--light" aria-hidden="true" />
  </div>

  <div class="auth-form-panel">
    <button id="theme-toggle" class="cb-btn cb-btn--ghost auth-theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">🌙</button>

    <div class="auth-card">
      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-subtitle">Choose a new password for your BugBeat account.</p>

      <div id="auth-error" class="auth-error" hidden></div>
      <div id="auth-success" class="auth-success" hidden></div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="password">New password</label>
          <div class="auth-field__input-wrap">
            <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" />
            <button type="button" class="auth-field__toggle-pw" data-target="password" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
          <div class="auth-field__hint">At least 8 characters, with a letter and a number</div>
        </div>
        <div class="auth-field">
          <label for="confirm">Confirm new password</label>
          <div class="auth-field__input-wrap">
            <input type="password" id="confirm" placeholder="Repeat your new password" autocomplete="new-password" />
            <button type="button" class="auth-field__toggle-pw" data-target="confirm" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
        </div>
        <button id="reset-btn" type="submit" class="auth-btn">Save new password</button>
      </form>

      <p class="auth-switch">
        <a href="login.html">Back to log in</a>
      </p>
    </div>
  </div>

  <script>
    const BACKEND_URL =
      (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : 'https://bugbeat.onrender.com';

    const form  = document.getElementById('reset-form');
    const btn   = document.getElementById('reset-btn');
    const errEl = document.getElementById('auth-error');
    const sucEl = document.getElementById('auth-success');

    // Read the token from the link, then remove it from the address bar so
    // it doesn't linger in history or show up in screenshots.
    const token = new URLSearchParams(location.search).get('token') || '';
    if (location.search) history.replaceState(null, '', location.pathname);

    function showError(text, withRequestLink) {
      errEl.textContent = text;
      if (withRequestLink) {
        errEl.append(' ');
        const a = document.createElement('a');
        a.href = 'forgot-password.html';
        a.textContent = 'Request a new link';
        a.style.color = 'inherit';
        a.style.fontWeight = '600';
        errEl.append(a);
      }
      errEl.hidden = false;
    }

    if (!/^[a-f0-9]{64}$/.test(token)) {
      showError('This reset link is incomplete or invalid. Make sure you opened the full link from the email.', true);
      btn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      errEl.hidden = true;
      sucEl.hidden = true;

      if (password.length < 8) return showError('Password must be at least 8 characters long.');
      if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
        return showError('Password must contain at least one letter and one number.');
      }
      if (password !== confirm) return showError('Passwords do not match.');

      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        const res = await fetch(`${BACKEND_URL}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const expired = /invalid or has expired/.test(data.error || '');
          showError(data.error || 'Could not reset your password. Please try again.', expired);
          btn.disabled = expired;
          btn.textContent = 'Save new password';
          return;
        }

        // Any old login on this browser was signed out by the reset.
        localStorage.removeItem('cb_token');
        localStorage.removeItem('cb_user');
        form.style.display = 'none'; // .auth-form's display:flex would override the hidden attribute
        sucEl.textContent = data.message + ' Taking you to the login page…';
        sucEl.hidden = false;
        setTimeout(() => { window.location.href = 'login.html'; }, 2500);
      } catch (err) {
        showError('Could not reach the server. Please try again in a moment.');
        btn.disabled = false;
        btn.textContent = 'Save new password';
      }
    });
  </script>
  <script src="theme.js"></script>
  <script src="rain.js"></script>
  <script src="pw-toggle.js"></script>

</body>
</html>
