<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugBeat — Forgot Password</title>
  <link rel="icon" type="image/png" href="bugbeatLogo.png" />
  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cb-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=7" />
  <link rel="stylesheet" href="auth.css?v=17" />
</head>
<body class="auth-page">

  <div class="auth-visual">
    <canvas id="auth-rain" class="auth-rain-bg" aria-hidden="true"></canvas>
    <img src="bugbeatLogo-bg.png" alt="" class="auth-bg-logo auth-bg-logo--dark" aria-hidden="true" />
    <img src="bugbeatLogo.png" alt="" class="auth-bg-logo auth-bg-logo--light" aria-hidden="true" />
  </div>

  <div class="auth-form-panel">
    <button id="theme-toggle" class="cb-btn cb-btn--ghost auth-theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">🌙</button>

    <div class="auth-card">
      <h1 class="auth-title">Forgot password?</h1>
      <p class="auth-subtitle">Enter your account's email and we'll send you a link to set a new password.</p>

      <div id="auth-error" class="auth-error" hidden></div>
      <div id="auth-success" class="auth-success" hidden></div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <button id="send-btn" type="submit" class="auth-btn">Send reset link</button>
      </form>

      <p class="auth-switch">
        Remembered it? <a href="login.html">Back to log in</a>
      </p>
    </div>
  </div>

  <script>
    const BACKEND_URL =
      (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : 'https://bugbeat.onrender.com';

    const form  = document.getElementById('forgot-form');
    const btn   = document.getElementById('send-btn');
    const errEl = document.getElementById('auth-error');
    const sucEl = document.getElementById('auth-success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      errEl.hidden = true;
      sucEl.hidden = true;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errEl.textContent = 'Please enter a valid email address.';
        errEl.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const res = await fetch(`${BACKEND_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not send the reset link. Please try again.');

        sucEl.textContent = data.message;
        sucEl.hidden = false;
        // Short cooldown so the button can't be spammed.
        btn.textContent = 'Link sent';
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = 'Send again';
        }, 30000);
      } catch (err) {
        errEl.textContent = err.message === 'Failed to fetch'
          ? 'Could not reach the server. Please try again in a moment.'
          : err.message;
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  </script>
  <script src="theme.js"></script>
  <script src="rain.js"></script>

</body>
</html>
