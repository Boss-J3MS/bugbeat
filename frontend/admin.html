<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugBeat — Admin Dashboard</title>
  <link rel="icon" type="image/png" href="bugbeatLogo.png" />
  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cb-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <header class="cb-header">
    <div class="cb-header__logo">
      <img src="bugbeatLogo.png" alt="BugBeat" class="cb-logo-img" />
      <span class="admin-badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <button class="admin-nav__btn active" data-tab="stats">📊 Stats</button>
      <button class="admin-nav__btn" data-tab="users">👥 Users</button>
      <button class="admin-nav__btn" data-tab="analyses">📋 Analyses</button>
    </nav>
    <div class="cb-user-info">
      <span id="user-greeting" class="cb-user-greeting"></span>
      <button id="theme-toggle" class="cb-btn cb-btn--ghost" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">🌙</button>
      <button id="app-link" type="button" class="cb-btn cb-btn--ghost">← App</button>
      <button id="logout-btn" class="cb-btn cb-btn--ghost">Logout</button>
    </div>
  </header>

  <main class="admin-main">

    <!-- ── STATS TAB ─────────────────────────── -->
    <div id="tab-stats" class="admin-tab active">
      <h2 class="admin-section-title">System Overview</h2>
      <div class="admin-stats-grid">
        <div class="admin-stat-card">
          <div class="admin-stat-card__num" id="stat-users">—</div>
          <div class="admin-stat-card__label">Total Users</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-card__num" id="stat-analyses">—</div>
          <div class="admin-stat-card__label">Total Analyses</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-card__num" id="stat-issues">—</div>
          <div class="admin-stat-card__label">Issues Found</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-card__num" id="stat-avg">—</div>
          <div class="admin-stat-card__label">Avg Risk Score</div>
        </div>
      </div>

      <div class="admin-row">
        <div class="admin-card">
          <h3 class="admin-card__title">Risk Breakdown</h3>
          <div id="risk-breakdown" class="admin-breakdown"></div>
        </div>
        <div class="admin-card">
          <h3 class="admin-card__title">Top Languages</h3>
          <div id="lang-breakdown" class="admin-breakdown"></div>
        </div>
        <div class="admin-card">
          <h3 class="admin-card__title">Recent Users</h3>
          <div id="recent-users" class="admin-breakdown"></div>
        </div>
      </div>
    </div>

    <!-- ── USERS TAB ─────────────────────────── -->
    <div id="tab-users" class="admin-tab">
      <div class="admin-tab-header">
        <h2 class="admin-section-title">Users</h2>
        <input type="text" id="user-search" class="cb-input cb-input--search" placeholder="Search by username or email…" />
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Analyses</th>
              <th>Joined</th>
              <th>Last Login</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ── ANALYSES TAB ──────────────────────── -->
    <div id="tab-analyses" class="admin-tab">
      <h2 class="admin-section-title">Recent Analyses</h2>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Language</th>
              <th>Lines</th>
              <th>Issues</th>
              <th>Risk Level</th>
              <th>Score</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="analyses-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Confirm modal -->
  <div id="confirm-modal" class="admin-modal" hidden>
    <div class="admin-modal__box">
      <p id="confirm-msg" class="admin-modal__msg"></p>
      <div class="admin-modal__actions">
        <button id="confirm-yes" class="cb-btn cb-btn--primary">Confirm</button>
        <button id="confirm-no" class="cb-btn cb-btn--ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'http://localhost:3000';
    const token = localStorage.getItem('cb_token');
    const user  = JSON.parse(localStorage.getItem('cb_user') || 'null');

    // Guard — must be admin
    if (!token || !user || user.role !== 'admin') {
      window.location.href = 'login.html';
    }

    document.getElementById('user-greeting').textContent = `👤 ${user.username}`;
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = 'login.html';
    });
    // Was <a href="index.html">, styled like every other header control
    // here but not actually one — a real button now, same as Admin was
    // on the main page.
    document.getElementById('app-link').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    }

    // ── Tab switching ──────────────────────────
    document.querySelectorAll('.admin-nav__btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.admin-nav__btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ── Confirm modal ──────────────────────────
    let confirmResolve = null;
    function confirm(msg) {
      return new Promise(resolve => {
        confirmResolve = resolve;
        document.getElementById('confirm-msg').textContent = msg;
        document.getElementById('confirm-modal').hidden = false;
      });
    }
    document.getElementById('confirm-yes').addEventListener('click', () => {
      document.getElementById('confirm-modal').hidden = true;
      confirmResolve?.(true);
    });
    document.getElementById('confirm-no').addEventListener('click', () => {
      document.getElementById('confirm-modal').hidden = true;
      confirmResolve?.(false);
    });

    // ── Load stats ─────────────────────────────
    async function loadStats() {
      const res  = await fetch(`${BACKEND_URL}/admin/stats`, { headers: authHeaders() });
      const data = await res.json();

      document.getElementById('stat-users').textContent    = data.totals.users;
      document.getElementById('stat-analyses').textContent = data.totals.analyses;
      document.getElementById('stat-issues').textContent   = data.totals.issues_found;
      document.getElementById('stat-avg').textContent      = data.totals.avg_score;

      // Risk breakdown
      // risk_level is stored as 'Low'/'Medium'/'High'/'Critical' (see
      // app.js's saveAnalysisToHistory) — lowercase the lookup and use
      // 'critical' as the key, or every badge here falls through to the
      // '#fff' fallback since nothing actually matches 'very_high'.
      const riskColors = { low: '#3b9e5e', medium: '#d9921e', high: '#d45a30', critical: '#d43c3c' };
      document.getElementById('risk-breakdown').innerHTML = data.risk_breakdown.map(r => `
        <div class="admin-breakdown__row">
          <span class="admin-breakdown__label" style="color:${riskColors[r.risk_level?.toLowerCase()] || '#fff'}">${r.risk_level}</span>
          <span class="admin-breakdown__val">${r.count}</span>
        </div>`).join('') || '<p class="admin-empty">No data yet</p>';

      // Language breakdown
      document.getElementById('lang-breakdown').innerHTML = data.lang_breakdown.map(l => `
        <div class="admin-breakdown__row">
          <span class="admin-breakdown__label">${l.language}</span>
          <span class="admin-breakdown__val">${l.count}</span>
        </div>`).join('') || '<p class="admin-empty">No data yet</p>';

      // Recent users
      document.getElementById('recent-users').innerHTML = data.recent_users.map(u => `
        <div class="admin-breakdown__row">
          <span class="admin-breakdown__label">${u.username}</span>
          <span class="admin-breakdown__val admin-role admin-role--${u.role}">${u.role}</span>
        </div>`).join('') || '<p class="admin-empty">No users yet</p>';
    }

    // ── Load users ─────────────────────────────
    let allUsers = [];
    async function loadUsers() {
      const res  = await fetch(`${BACKEND_URL}/admin/users`, { headers: authHeaders() });
      const data = await res.json();
      allUsers   = data.users;
      renderUsers(allUsers);
    }

    function renderUsers(users) {
      document.getElementById('users-tbody').innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.username}</td>
          <td>${u.email}</td>
          <td><span class="admin-role admin-role--${u.role}">${u.role}</span></td>
          <td>${u.total_analyses}</td>
          <td>${formatDate(u.created_at)}</td>
          <td>${u.last_login ? formatDate(u.last_login) : '—'}</td>
          <td class="admin-actions">
            ${u.id !== user.id ? `
              <button class="cb-btn cb-btn--ghost admin-btn-sm"
                onclick="toggleRole(${u.id}, '${u.role}')">
                ${u.role === 'admin' ? 'Demote' : 'Promote'}
              </button>
              <button class="cb-btn cb-btn--ghost admin-btn-sm admin-btn-danger"
                onclick="deleteUser(${u.id}, '${u.username}')">
                Delete
              </button>
            ` : '<span class="admin-empty">You</span>'}
          </td>
        </tr>`).join('') || '<tr><td colspan="8" class="admin-empty">No users found</td></tr>';
    }

    // Search users
    document.getElementById('user-search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      renderUsers(allUsers.filter(u =>
        u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
      ));
    });

    async function toggleRole(id, currentRole) {
      const newRole = currentRole === 'admin' ? 'user' : 'admin';
      const ok = await confirm(`Change this user's role to "${newRole}"?`);
      if (!ok) return;
      await fetch(`${BACKEND_URL}/admin/users/${id}/role`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify({ role: newRole })
      });
      loadUsers();
    }

    async function deleteUser(id, username) {
      const ok = await confirm(`Delete user "${username}"? This cannot be undone.`);
      if (!ok) return;
      await fetch(`${BACKEND_URL}/admin/users/${id}`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      loadUsers();
    }

    // ── Load analyses ──────────────────────────
    async function loadAnalyses() {
      const res  = await fetch(`${BACKEND_URL}/admin/analyses`, { headers: authHeaders() });
      const data = await res.json();
      const riskColors = { low: '#3b9e5e', medium: '#d9921e', high: '#d45a30', critical: '#d43c3c' };
      document.getElementById('analyses-tbody').innerHTML = data.analyses.map(a => `
        <tr>
          <td>${a.id}</td>
          <td>${a.username}</td>
          <td>${a.language}</td>
          <td>${a.total_lines}</td>
          <td>${a.issues_found}</td>
          <td><span style="color:${riskColors[a.risk_level?.toLowerCase()] || '#fff'}">${a.risk_level}</span></td>
          <td>${a.fusion_score}</td>
          <td>${formatDate(a.created_at)}</td>
        </tr>`).join('') || '<tr><td colspan="8" class="admin-empty">No analyses yet</td></tr>';
    }

    function formatDate(d) {
      return d ? new Date(d).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    }

    // ── Init ───────────────────────────────────
    loadStats();
    loadUsers();
    loadAnalyses();
  </script>
  <script src="theme.js"></script>

</body>
</html>
