<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugBeat — Login</title>
  <link rel="icon" type="image/png" href="bugbeatLogo.png" />
  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cb-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=7" />
  <link rel="stylesheet" href="auth.css?v=17" />
</head>
<body class="auth-page">

  <div class="auth-visual">
    <canvas id="auth-rain" class="auth-rain-bg" aria-hidden="true"></canvas>
    <img src="bugbeatLogo-bg.png" alt="" class="auth-bg-logo auth-bg-logo--dark" aria-hidden="true" />
    <img src="bugbeatLogo.png" alt="" class="auth-bg-logo auth-bg-logo--light" aria-hidden="true" />
  </div>

  <div class="auth-form-panel">
    <button id="theme-toggle" class="cb-btn cb-btn--ghost auth-theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">🌙</button>

    <div class="auth-card">
      <h1 class="auth-title">Welcome</h1>
      <p class="auth-subtitle">Log in to continue analyzing code</p>

      <div id="auth-error" class="auth-error" hidden></div>
      <div id="auth-success" class="auth-success" hidden></div>

      <div class="auth-form">
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <div class="auth-field__input-wrap">
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
            <button type="button" class="auth-field__toggle-pw" data-target="password" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
          <div class="auth-forgot"><a href="forgot-password.html">Forgot password?</a></div>
        </div>
        <button id="login-btn" class="auth-btn">Log in</button>
      </div>

      <div class="auth-divider"><span>or</span></div>
      <div id="google-signin-btn" class="auth-google-btn">
        <div id="g_id_onload"
             data-client_id="808651930530-j1sriogp05ejiheq8bq2hjgohf0l4em2.apps.googleusercontent.com"
             data-callback="handleGoogleCredential"
             data-locale="en"
             data-auto_prompt="false">
        </div>
        <div id="g_id_signin_widget"
             class="g_id_signin"
             data-type="standard"
             data-theme="outline"
             data-size="large"
             data-text="continue_with"
             data-locale="en">
        </div>
      </div>

      <p class="auth-switch">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Not async/defer on purpose: sets the button width before Google's
       deferred script below draws it. See google-btn.js. -->
  <script src="google-btn.js?v=4"></script>
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script>
    const BACKEND_URL =
      (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : 'https://bugbeat.onrender.com';

    // Where to go after logging in: back to an admin invite if that's what
    // sent the user here (admin-invite.html sets this), otherwise the app.
    function nextPage() {
      let next = null;
      try {
        next = sessionStorage.getItem('cb_after_login');
        sessionStorage.removeItem('cb_after_login');
      } catch (e) {}
      return next === 'admin-invite.html' ? next : 'index.html';
    }

    const GOOGLE_CLIENT_ID = '808651930530-j1sriogp05ejiheq8bq2hjgohf0l4em2.apps.googleusercontent.com';

    // Redirect if already logged in
    if (localStorage.getItem('cb_token')) {
      window.location.href = nextPage();
    }

    // Shared with the password-login flow below: on success, save the
    // token/user and redirect the same way either path finishes.
    function onAuthSuccess(data, welcomeName) {
      localStorage.setItem('cb_token', data.token);
      localStorage.setItem('cb_user',  JSON.stringify(data.user));
      const sucEl = document.getElementById('auth-success');
      const errEl = document.getElementById('auth-error');
      errEl.hidden = true;
      sucEl.textContent = `Welcome${welcomeName ? ', ' + welcomeName : ''}! Redirecting…`;
      sucEl.hidden = false;
      setTimeout(() => window.location.href = nextPage(), 1000);
    }

    async function handleGoogleCredential(response) {
      const errEl = document.getElementById('auth-error');
      errEl.hidden = true;
      try {
        const res  = await fetch(`${BACKEND_URL}/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Google sign-in failed.');
        onAuthSuccess(data, data.user.username);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      }
    }

    // No initialize()/renderButton() call needed — the g_id_onload /
    // g_id_signin_widget divs above auto-initialize from their data
    // attributes once the deferred script loads.

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('auth-error');
      const sucEl    = document.getElementById('auth-success');

      errEl.hidden = true;
      sucEl.hidden = true;

      if (!email || !password) {
        errEl.textContent = 'Please fill in all fields.';
        errEl.hidden = false;
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Logging in…';

      try {
        const res  = await fetch(`${BACKEND_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Login failed.');

        // Save token and user info
        localStorage.setItem('cb_token', data.token);
        localStorage.setItem('cb_user',  JSON.stringify(data.user));

        sucEl.textContent = `Welcome back, ${data.user.username}! Redirecting…`;
        sucEl.hidden = false;
        setTimeout(() => window.location.href = nextPage(), 1000);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Log in';
      }
    });

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  </script>
  <script src="theme.js"></script>
  <script src="rain.js"></script>
  <script src="pw-toggle.js"></script>

</body>
</html>
